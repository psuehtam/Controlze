<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="title description">
  <title id="title">Controlze - fluxo de telas</title>
  <desc id="description">Diagrama dos fluxos do jogador e do administrador no aplicativo Controlze.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#047857"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 38px; font-weight: 700; fill: #13223a; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #52637d; }
      .section-title { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; }
      .node-title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #14213d; }
      .node-body { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #40516a; }
      .node-small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #40516a; }
      .arrow-label { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; }
      .footer { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #29405f; }
    </style>
  </defs>

  <rect width="1600" height="1300" fill="#f7f9fc"/>
  <text x="70" y="62" class="title">Controlze - fluxo de telas</text>
  <text x="70" y="94" class="subtitle">Navegação separada para jogador e administrador</text>

  <!-- Fluxo do jogador -->
  <rect x="40" y="125" width="1520" height="520" rx="28" fill="#eaf3ff" stroke="#c8ddfb" stroke-width="2"/>
  <text x="78" y="174" class="section-title" fill="#1d4f91">JOGADOR</text>

  <rect x="85" y="225" width="220" height="130" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="195" y="270" class="node-title" text-anchor="middle">Início</text>
  <text x="195" y="300" class="node-body" text-anchor="middle">Informar nome</text>
  <text x="195" y="324" class="node-small" text-anchor="middle">Jogar só com nome preenchido</text>

  <rect x="380" y="225" width="230" height="130" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="495" y="264" class="node-title" text-anchor="middle">Antes da partida</text>
  <text x="495" y="294" class="node-body" text-anchor="middle">Nome, fases e regra</text>
  <text x="495" y="318" class="node-small" text-anchor="middle">Carregar fases ou sair</text>

  <rect x="685" y="225" width="230" height="130" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="800" y="264" class="node-title" text-anchor="middle">Durante a partida</text>
  <text x="800" y="294" class="node-body" text-anchor="middle">4 formatos de fase</text>
  <text x="800" y="318" class="node-small" text-anchor="middle">Acerto avança; erro volta à fase 1</text>

  <rect x="990" y="225" width="210" height="130" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="1095" y="270" class="node-title" text-anchor="middle">Vitória</text>
  <text x="1095" y="300" class="node-body" text-anchor="middle">Tempo + erros</text>
  <text x="1095" y="324" class="node-small" text-anchor="middle">Resultado gravado no ranking</text>

  <rect x="1275" y="225" width="215" height="130" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="1382" y="270" class="node-title" text-anchor="middle">Ranking</text>
  <text x="1382" y="300" class="node-body" text-anchor="middle">Busca e ordenação</text>
  <text x="1382" y="324" class="node-small" text-anchor="middle">Consulta para o jogador</text>

  <line x1="305" y1="290" x2="380" y2="290" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="342" y="275" class="arrow-label" fill="#2563eb" text-anchor="middle">Jogar</text>
  <line x1="610" y1="290" x2="685" y2="290" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="647" y="275" class="arrow-label" fill="#2563eb" text-anchor="middle">Começar</text>
  <line x1="915" y1="290" x2="990" y2="290" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="952" y="275" class="arrow-label" fill="#2563eb" text-anchor="middle">Última fase</text>
  <line x1="1200" y1="290" x2="1275" y2="290" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="1237" y="275" class="arrow-label" fill="#2563eb" text-anchor="middle">Ver ranking</text>

  <path d="M800,355 C800,420 235,420 195,355" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="500" y="414" class="arrow-label" fill="#2563eb" text-anchor="middle">Erro - reinicia na fase 1</text>
  <text x="1095" y="390" class="node-small" text-anchor="middle">Jogar de novo ou Sair para o início</text>

  <rect x="250" y="500" width="1100" height="78" rx="16" fill="#d9eafe" stroke="#9ec5fb" stroke-width="2"/>
  <text x="800" y="530" class="footer" text-anchor="middle">Navegação inferior do jogador</text>
  <text x="800" y="556" class="footer" text-anchor="middle">Jogar  ↔  Ranking  ↔  Config (nome e exibição de erros)</text>

  <!-- Fluxo do administrador -->
  <rect x="40" y="690" width="1520" height="545" rx="28" fill="#e9f8f2" stroke="#b8e2d0" stroke-width="2"/>
  <text x="78" y="739" class="section-title" fill="#08705a">ADMINISTRADOR</text>
  <text x="78" y="769" class="subtitle">Perfil simulado: não há login, senha ou PIN no aplicativo.</text>

  <rect x="85" y="850" width="220" height="130" rx="18" fill="#ffffff" stroke="#047857" stroke-width="3"/>
  <text x="195" y="895" class="node-title" text-anchor="middle">Início</text>
  <text x="195" y="925" class="node-body" text-anchor="middle">Painel de fases</text>
  <text x="195" y="949" class="node-small" text-anchor="middle">Ativa isAdmin</text>

  <rect x="395" y="830" width="285" height="170" rx="18" fill="#ffffff" stroke="#047857" stroke-width="3"/>
  <text x="537" y="870" class="node-title" text-anchor="middle">Painel de fases</text>
  <text x="537" y="900" class="node-body" text-anchor="middle">Filtros: Todas, Originais, Criadas</text>
  <text x="537" y="925" class="node-small" text-anchor="middle">Originais bloqueadas</text>
  <text x="537" y="948" class="node-small" text-anchor="middle">Criadas: editar, mover e excluir</text>

  <rect x="770" y="830" width="285" height="170" rx="18" fill="#ffffff" stroke="#047857" stroke-width="3"/>
  <text x="912" y="870" class="node-title" text-anchor="middle">Criar / editar fase</text>
  <text x="912" y="900" class="node-body" text-anchor="middle">Pergunta + 4 alternativas</text>
  <text x="912" y="925" class="node-small" text-anchor="middle">Uma correta; alternativas diferentes</text>
  <text x="912" y="948" class="node-small" text-anchor="middle">Salvar ou cancelar volta ao painel</text>

  <rect x="1145" y="830" width="320" height="170" rx="18" fill="#ffffff" stroke="#047857" stroke-width="3"/>
  <text x="1305" y="870" class="node-title" text-anchor="middle">Ranking no modo admin</text>
  <text x="1305" y="900" class="node-body" text-anchor="middle">Busca e ordenação</text>
  <text x="1305" y="925" class="node-small" text-anchor="middle">Editar nome, excluir resultado</text>
  <text x="1305" y="948" class="node-small" text-anchor="middle">ou apagar todo o ranking</text>

  <line x1="305" y1="915" x2="395" y2="915" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="350" y="897" class="arrow-label" fill="#047857" text-anchor="middle">Entrar</text>
  <line x1="680" y1="895" x2="770" y2="895" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="725" y="877" class="arrow-label" fill="#047857" text-anchor="middle">Nova / editar</text>
  <path d="M680,850 L720,810 L1120,810 Q1145,810 1145,835" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="922" y="798" class="arrow-label" fill="#047857" text-anchor="middle">Acessar ranking</text>
  <path d="M912,1000 C912,1050 590,1050 537,1000" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="720" y="1043" class="arrow-label" fill="#047857" text-anchor="middle">Salvar / cancelar</text>
  <path d="M395,970 C365,1030 250,1035 195,980" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="270" y="1025" class="arrow-label" fill="#047857" text-anchor="middle">Sair (isAdmin = false)</text>

  <rect x="250" y="1105" width="1100" height="78" rx="16" fill="#d7f2e6" stroke="#9dd8bb" stroke-width="2"/>
  <text x="800" y="1135" class="footer" text-anchor="middle">Navegação inferior no modo administrador</text>
  <text x="800" y="1161" class="footer" text-anchor="middle">Jogar  ↔  Ranking  ↔  Config  ↔  Painel</text>
</svg>
